# =================================================================
#  AI Pull Request Reviewer — GitHub Actions Workflow
#  Runs on every PR. Posts a detailed automated review comment.
#  Uses only the built-in GITHUB_TOKEN — no paid services needed.
# =================================================================

name: 🤖 AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['**']

# Cancel stale runs when a new commit is pushed to the same PR
concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: Analyze & Post AI Review
    runs-on: ubuntu-latest
    permissions:
      contents: read       # read source code
      pull-requests: write # post PR comments

    steps:
      # 1. Checkout with full history for accurate diffs
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up Flutter stable
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: 'stable'
          cache: true

      # 3. Install pub dependencies
      - name: Install dependencies
        run: flutter pub get

      # 4. Static analysis — capture output, never fail the step itself
      - name: Run dart analyze
        id: analyze
        run: |
          set +e
          OUTPUT=$(dart analyze lib/ 2>&1)
          CODE=$?
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT"     >> $GITHUB_OUTPUT
          echo "EOF"         >> $GITHUB_OUTPUT
          echo "exit_code=$CODE" >> $GITHUB_OUTPUT

      # 5. Unit/widget tests — capture output, never fail the step itself
      - name: Run flutter test
        id: tests
        run: |
          set +e
          OUTPUT=$(flutter test --no-pub 2>&1)
          CODE=$?
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT"     >> $GITHUB_OUTPUT
          echo "EOF"         >> $GITHUB_OUTPUT
          echo "exit_code=$CODE" >> $GITHUB_OUTPUT

      # 6. Collect diff metadata (files, stats, security signals)
      - name: Collect diff metadata
        id: meta
        run: |
          BASE=origin/${{ github.base_ref }}
          FILES=$(git diff --name-only $BASE...HEAD | head -60)
          COUNT=$(git diff --name-only $BASE...HEAD | wc -l | tr -d ' ')
          ADDS=$(git diff --numstat $BASE...HEAD | awk '{s+=$1} END {print s+0}')
          DELS=$(git diff --numstat $BASE...HEAD | awk '{s+=$2} END {print s+0}')
          DART=$(git diff --name-only $BASE...HEAD | grep -c "lib/.*\.dart" || echo 0)
          TSRC=$(git diff --name-only $BASE...HEAD | grep -c "test/.*\.dart" || echo 0)
          SENS=$(git diff --name-only $BASE...HEAD \
            | grep -iE "(password|secret|token|key|auth|credential|\.env|pubspec\.yaml|database\.dart)" \
            || true)
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
            echo "count=$COUNT"
            echo "adds=$ADDS"
            echo "dels=$DELS"
            echo "dart=$DART"
            echo "tsrc=$TSRC"
            echo "sensitive<<EOF"
            echo "$SENS"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          if [ -n "$SENS" ]; then
            echo "has_sensitive=true"  >> $GITHUB_OUTPUT
          else
            echo "has_sensitive=false" >> $GITHUB_OUTPUT
          fi
      # 7. Build and post the AI review comment
      - name: Post AI review comment
        uses: actions/github-script@v7
        env:
          ANALYZE_OUTPUT: ${{ steps.analyze.outputs.output }}
          ANALYZE_EXIT:   ${{ steps.analyze.outputs.exit_code }}
          TEST_OUTPUT:    ${{ steps.tests.outputs.output }}
          TEST_EXIT:      ${{ steps.tests.outputs.exit_code }}
          CHANGED_FILES:  ${{ steps.meta.outputs.files }}
          FILES_COUNT:    ${{ steps.meta.outputs.count }}
          ADDITIONS:      ${{ steps.meta.outputs.adds }}
          DELETIONS:      ${{ steps.meta.outputs.dels }}
          DART_FILES:     ${{ steps.meta.outputs.dart }}
          TEST_FILES:     ${{ steps.meta.outputs.tsrc }}
          SECURITY_FILES: ${{ steps.meta.outputs.sensitive }}
          HAS_SENSITIVE:  ${{ steps.meta.outputs.has_sensitive }}
          PR_HEAD:        ${{ github.head_ref }}
          PR_BASE:        ${{ github.base_ref }}
          PR_AUTHOR:      ${{ github.event.pull_request.user.login }}
          RUN_ID:         ${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const ok_a = process.env.ANALYZE_EXIT === '0';
            const ok_t = process.env.TEST_EXIT    === '0';
            const sens = process.env.HAS_SENSITIVE === 'true';
            const df   = parseInt(process.env.DART_FILES)  || 0;
            const tf   = parseInt(process.env.TEST_FILES)  || 0;
            const fc   = parseInt(process.env.FILES_COUNT) || 0;
            const add  = parseInt(process.env.ADDITIONS)   || 0;
            const del  = parseInt(process.env.DELETIONS)   || 0;
            const trunc = (s, n=2500) =>
              s.length > n ? s.slice(0,n)+'\n…(truncated – see Actions logs)' : s;
            let score = 100;
            if (!ok_a) score -= 30;
            if (!ok_t) score -= 30;
            if (sens)  score -= 10;
            if (df > 0 && tf === 0) score -= 10;
            const bar   = '█'.repeat(Math.floor(score/10))+'░'.repeat(10-Math.floor(score/10));
            const badge = score>=90?'🟢 Excellent':score>=70?'🟡 Good':score>=50?'🟠 Needs Work':'🔴 Critical Issues';
            const flist = process.env.CHANGED_FILES.trim().split('\n').filter(Boolean).map(f=>{
              const ic=f.startsWith('lib/')?'🎯':f.startsWith('test/')?'🧪':
                f.startsWith('.github/')?'⚙️':f==='pubspec.yaml'?'📦':f==='pubspec.lock'?'🔒':'📄';
              return ic+' `'+f+'`';
            }).join('\n');
            const aBlk = ok_a
              ? '✅ **No issues found** — static analysis clean.'
              : '❌ **Issues detected** — fix before merging:\n```\n'+trunc(process.env.ANALYZE_OUTPUT)+'\n```';
            const tsum=(process.env.TEST_OUTPUT.split('\n').filter(l=>l.match(/passed|failed/)).pop()||'').trim();
            const tBlk = ok_t
              ? '✅ **All tests passed**'+(tsum?' — `'+tsum+'`':'')
              : '❌ **Test failures:**\n```\n'+trunc(process.env.TEST_OUTPUT)+'\n```';
            const sF=process.env.SECURITY_FILES.trim().split('\n').filter(Boolean);
            const sBlk=sens
              ? '⚠️ **Security-sensitive files changed** — verify no secrets hardcoded:\n'+sF.map(f=>'  - `'+f+'`').join('\n')
              : '✅ No security-sensitive files changed.';
            const cBlk=(df>0&&tf===0)
              ? '⚠️ **No test files updated** — '+df+' source file(s) changed, 0 test files. Add tests in `test/`.'
              : '✅ '+(tf>0?tf+' test file(s) updated alongside '+df+' source file(s) — great! 👍':'No changes.');
            const verdict=(ok_a&&ok_t)
              ? '> ✅ **This PR looks good to merge.** All automated checks passed.'
              : '> ❌ **This PR is NOT ready to merge.** Resolve issues above first.';

            const rows=[
              '| **Files changed** | '+fc+' |',
              '| **Lines added** | +'+add+' |',
              '| **Lines removed** | -'+del+' |',
              '| **Dart source files** | '+df+' |',
              '| **Test files** | '+tf+' |',
              '| **Branch** | `'+process.env.PR_HEAD+'` → `'+process.env.PR_BASE+'` |',
              '| **Author** | @'+process.env.PR_AUTHOR+' |',
            ].join('\n');
            const body=[
              '## 🤖 AI Code Review — Automated Analysis','',verdict,'','---','',
              '### 📊 PR Overview','| Metric | Value |','|--------|-------|',rows,'',
              '### 🎯 Quality Score','`'+bar+'` **'+score+'/100** — '+badge,'','---','',
              '### '+(ok_a?'✅':'❌')+' Static Analysis (`dart analyze`)',aBlk,'','---','',
              '### '+(ok_t?'✅':'❌')+' Test Suite (`flutter test`)',tBlk,'','---','',
              '### '+(sens?'⚠️':'✅')+' Security Check',sBlk,'','---','',
              '### '+((df>0&&tf===0)?'⚠️':'✅')+' Test Coverage Check',cBlk,'','---','',
              '### 📂 Changed Files ('+fc+')','<details><summary>Click to expand</summary>','',
              flist||'_No files listed._','','</details>','','---','',
              '### ✅ Human Reviewer Checklist',
              '- [ ] Code follows the project\'s naming and style conventions',
              '- [ ] No hardcoded credentials, passwords, or API keys',
              '- [ ] UI changes tested on narrow screens (overflow check)',
              '- [ ] New features have corresponding tests in `test/`',
              '- [ ] `pubspec.yaml` changes are intentional and `pubspec.lock` is committed',
              '- [ ] Database-related changes are backward compatible',
              '- [ ] The "Remember Me" auth session flow is not weakened',
              '','---','',
              '<sub>🤖 Automated · Run ID: '+process.env.RUN_ID+' · Supplements — not replaces — human review.</sub>',
            ].join('\n');
            const {data:cmts}=await github.rest.issues.listComments({
              owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number
            });
            for(const c of cmts){
              if(c.user.type==='Bot'&&c.body.includes('🤖 AI Code Review — Automated Analysis')){
                await github.rest.issues.deleteComment({
                  owner:context.repo.owner,repo:context.repo.repo,comment_id:c.id
                });
              }
            }
            await github.rest.issues.createComment({
              owner:context.repo.owner,repo:context.repo.repo,
              issue_number:context.issue.number,body
            });
            if(!ok_a||!ok_t){
              core.setFailed('AI Review: '+(!ok_a?'dart analyze issues. ':'')+(!ok_t?'flutter test failed.':''));
            }

