# =================================================================
#  Flutter CI — runs on every PR and every push to main.
#  Provides the required status checks teammates see on PRs.
# =================================================================

name: 🚀 Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Static analysis ───────────────────────────────────────
  analyze:
    name: 🔍 dart analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: dart analyze lib/ --fatal-infos

  # ── Job 2: Tests ─────────────────────────────────────────────────
  test:
    name: 🧪 flutter test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Run tests
        run: flutter test --no-pub --reporter expanded

  # ── Job 3: Build APK (confirm the app still compiles) ───────────
  build:
    name: 🏗️ Build APK
    runs-on: ubuntu-latest
    needs: [analyze, test]   # only build if analyze + tests pass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Build APK (debug)
        run: flutter build apk --debug --no-pub
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
